<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeLegends - Web Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0e0b16;
      --card-bg: #161224;
      --card-inner: #1c172e;
      --accent-yellow: #fbc02d;
      --accent-purple: #8a2be2;
      --accent-cyan: #00f0ff;
      --accent-red: #ff4d4d;
      --text-main: #f3f0ff;
      --text-muted: #a39bb8;
      --border-glow: rgba(138, 43, 226, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: rgba(22, 18, 36, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-glow); position: sticky; top: 0; z-index: 100; padding: 14px 28px; }
    .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
    .brand img { height: 38px; border-radius: 6px; }
    .brand-title { font-weight: 800; font-size: 1.15rem; color: #fff; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
    .nav-link:hover { color: #fff; }
    .nav-btn { background: #8a2be2; color: #fff; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; transition: background 0.2s; }
    .nav-btn:hover { background: #9d3bf0; }

    main { max-width: 1100px; margin: 35px auto; padding: 0 20px; flex: 1; width: 100%; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-bottom: 35px; }
    .hero-subtitle { color: var(--accent-yellow); font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .hero-title { font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
    .hero-title span { color: var(--accent-yellow); }
    .hero-desc { color: var(--text-muted); font-size: 0.95rem; max-width: 520px; line-height: 1.5; }
    .hero-logo { max-width: 180px; border-radius: 12px; filter: drop-shadow(0 0 25px rgba(138,43,226,0.4)); }

    .grid-layout { display: grid; grid-template-columns: 1fr 320px; gap: 25px; align-items: start; }
    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } .hero { flex-direction: column; text-align: center; } }

    .card { background: var(--card-bg); border: 1px solid var(--border-glow); border-radius: 16px; padding: 24px; }
    .card-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .hud-item { background: var(--card-inner); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 10px; text-align: center; }
    .hud-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .hud-value { font-size: 1.5rem; font-weight: 800; color: #fff; }

    .arena-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .hole { background: var(--card-inner); border: 1px solid rgba(255, 255, 255, 0.08); height: 105px; border-radius: 12px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-end; cursor: pointer; user-select: none; }
    .mole { width: 65px; height: 65px; object-fit: contain; position: absolute; bottom: -80px; transition: bottom 0.15s; pointer-events: none; }
    .hole.up .mole { bottom: 18px; }

    .btn-action { width: 100%; background: var(--accent-yellow); color: #0e0b16; font-weight: 800; font-size: 1rem; padding: 14px; border: none; border-radius: 10px; cursor: pointer; }
    .btn-action:disabled { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); cursor: not-allowed; }

    .legend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .legend-item:last-child { border-bottom: none; }
    .legend-info { display: flex; align-items: center; gap: 12px; }
    .legend-img { width: 38px; height: 38px; object-fit: contain; }
    .legend-name { font-weight: 700; font-size: 0.85rem; }
    .legend-pts { font-weight: 800; font-size: 0.85rem; }
    .pts-plus { color: #4caf50; } .pts-high { color: var(--accent-yellow); } .pts-minus { color: var(--accent-red); }

    .claim-box { margin-top: 20px; background: var(--card-inner); padding: 12px; border-radius: 10px; border: 1px dashed var(--border-glow); display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
    .claim-code { font-family: monospace; font-size: 0.85rem; color: var(--accent-yellow); font-weight: 700; }
    .btn-copy { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: none; }
    .btn-copy:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <img src="assets/pokelegends.jpg" alt="Logo" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'">
        <span class="brand-title">POKE LEGENDS</span>
      </a>
      <div class="nav-links">
        <a href="https://pokelegends-stats.pages.dev/" target="_blank" class="nav-link">Tournaments</a>
        <a href="https://store.poke-legends.com" target="_blank" class="nav-btn">Store ↗</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="hero-subtitle">Poke Legends • Web Event</div>
        <h1 class="hero-title">Whack a <span>Mon!</span></h1>
        <p class="hero-desc">Test your reflexes in this high-speed Cobblemon event! Score 25,000+ points before time runs out to earn an exclusive in-game reward code!</p>
      </div>
      <img src="assets/pokelegends.jpg" alt="PokeLegends Logo" class="hero-logo" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'">
    </section>

    <!-- DYNAMIC EVENT CONTAINER -->
    <div class="grid-layout" id="event-content">
      <!-- Active event injects here automatically -->
    </div>
  </main>

  <!-- Script Module Loader -->
  <script type="module">
    import { loadActiveEvent } from './js/active-event.js';
    loadActiveEvent();
  </script>
</body>
</html>
